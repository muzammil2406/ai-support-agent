# Google Cloud Build config — builds the image, runs migrations, deploys to Cloud Run.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_DATABASE_URL=...,_MONGODB_URI=...,_UPSTASH_REDIS_REST_URL=..., \
#     _UPSTASH_REDIS_REST_TOKEN=...,_GROQ_API_KEY=...,_GOOGLE_API_KEY=...,_JWT_SECRET=..., \
#     _LLM_PROVIDER=groq,_LLM_MODEL=llama-3.3-70b-versatile,_EMBEDDINGS_MODEL=text-embedding-004,_CORS_ORIGIN=... \
#     --region=us-central1
#
# (Substitutions can also live in a trusted source, e.g. a Secret Manager fetch.)

steps:
  # 1) Build + push the image (SWC compile, Prisma client generated inside).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-support-agent:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-support-agent:latest'

  # 2) Apply pending Prisma migrations to Neon before rolling out the new revision.
  - name: 'node:22'
    entrypoint: 'npx'
    args: ['prisma', 'migrate', 'deploy']
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'

  # 3) Deploy to Cloud Run (512Mi — sized for the project's light workload).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-support-agent'
      - '--image=gcr.io/$PROJECT_ID/ai-support-agent:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--timeout=120'
      - >-
        --set-env-vars=^:^DATABASE_URL=${_DATABASE_URL}:MONGODB_URI=${_MONGODB_URI}:UPSTASH_REDIS_REST_URL=${_UPSTASH_REDIS_REST_URL}:UPSTASH_REDIS_REST_TOKEN=${_UPSTASH_REDIS_REST_TOKEN}:GROQ_API_KEY=${_GROQ_API_KEY}:GOOGLE_API_KEY=${_GOOGLE_API_KEY}:JWT_SECRET=${_JWT_SECRET}:LLM_PROVIDER=${_LLM_PROVIDER}:LLM_MODEL=${_LLM_MODEL}:EMBEDDINGS_MODEL=${_EMBEDDINGS_MODEL}:CORS_ORIGIN=${_CORS_ORIGIN}:PORT=8080

substitutions:
  _DATABASE_URL: ''
  _MONGODB_URI: ''
  _UPSTASH_REDIS_REST_URL: ''
  _UPSTASH_REDIS_REST_TOKEN: ''
  _GROQ_API_KEY: ''
  _GOOGLE_API_KEY: ''
  _JWT_SECRET: ''
  _LLM_PROVIDER: 'groq'
  _LLM_MODEL: 'llama-3.3-70b-versatile'
  _EMBEDDINGS_MODEL: 'text-embedding-004'
  _CORS_ORIGIN: 'http://localhost:3000'

options:
  logging: CLOUD_LOGGING_ONLY
