AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nova — isolated escalation fan-out stack (Part 2). Streams support-ticket
  escalations from the Nova backend into SQS, consumes them with a Lambda that
  logs to CloudWatch + records to DynamoDB, and raises a CloudWatch alarm on
  queue depth. Fully independent of the main Nova deployment.

Parameters:
  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda (aws/lambda/function.zip).
  ArtifactKey:
    Type: String
    Default: escalations/lambda/function.zip
    Description: S3 key of the packaged Lambda.
  QueueName:
    Type: String
    Default: nova-escalations
  TableName:
    Type: String
    Default: nova-escalations
  LambdaRuntime:
    Type: String
    Default: nodejs22.x
    AllowedValues: [nodejs18.x, nodejs20.x, nodejs22.x]
  LogRetentionDays:
    Type: Number
    Default: 7
  AlarmEmail:
    Type: String
    Default: ''
    Description: SNS email to subscribe for the queue-depth alarm (optional).
  ApiCallbackUrl:
    Type: String
    Default: ''
    Description: >-
      Optional Nova backend endpoint the Lambda POSTs each escalation back to
      (e.g. https://nova-backend.example.com/api/aws/escalations).

Resources:
  # ── SQS ──────────────────────────────────────────────────────────────────
  EscalationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: 60
      MessageRetentionPeriod: 1209600 # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EscalationDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: app
          Value: nova

  EscalationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${QueueName}-dlq'
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: app
          Value: nova

  # ── DynamoDB ─────────────────────────────────────────────────────────────
  EscalationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: escalatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByEscalatedAt
          KeySchema:
            - AttributeName: escalatedAt
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: app
          Value: nova

  # ── IAM ──────────────────────────────────────────────────────────────────
  EscalationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nova-escalation-consumer-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBEscalationWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub '${EscalationTable.Arn}*'
        - PolicyName: CloudWatchLogsEscalation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # ── Lambda + log group ──────────────────────────────────────────────────
  EscalationLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nova-escalation-consumer'
      RetentionInDays: !Ref LogRetentionDays

  EscalationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nova-escalation-consumer
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Role: !GetAtt EscalationLambdaRole.Arn
      MemorySize: 128
      Timeout: 30
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          ESCALATION_TABLE_NAME: !Ref TableName
          NOVA_API_CALLBACK_URL: !Ref ApiCallbackUrl
      Tags:
        - Key: app
          Value: nova

  # ── SQS → Lambda event source ────────────────────────────────────────────
  EscalationEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt EscalationQueue.Arn
      FunctionName: !GetAtt EscalationLambda.Arn
      BatchSize: 5
      Enabled: true

  # ── CloudWatch alarm ─────────────────────────────────────────────────────
  EscalationQueueDepthAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: nova-escalation-depth-alarm

  EscalationQueueDepthAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref EscalationQueueDepthAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  EscalationQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nova-escalation-queue-depth
      AlarmDescription: >-
        SQS queue depth for nova-escalations exceeds 10 unprocessed messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - HasAlarmEmail
          - !Ref EscalationQueueDepthAlarmTopic
          - !Ref 'AWS::NoValue'
      OKActions:
        - !If
          - HasAlarmEmail
          - !Ref EscalationQueueDepthAlarmTopic
          - !Ref 'AWS::NoValue'

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Outputs:
  EscalationQueueUrl:
    Description: SQS queue URL for the Nova backend env AWS_SQS_ESCALATION_QUEUE_URL.
    Value: !Ref EscalationQueue
  EscalationQueueName:
    Value: !Ref QueueName
  EscalationTableName:
    Value: !Ref EscalationTable
  EscalationLambdaFunctionName:
    Value: !Ref EscalationLambda
  EscalationLambdaLogGroup:
    Value: !Ref EscalationLambdaLogGroup
  EscalationQueueDepthAlarmName:
    Value: !Ref EscalationQueueDepthAlarm