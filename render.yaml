# Render Blueprint — AI Support Agent backend (NestJS + LangGraph, free tier)
# Deploy: Render dashboard → New → Blueprint → pick this repo → fill the
# `sync: false` environment variables with the values from backend/.env.
services:
  - type: web
    name: ai-support-agent-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: gemini-embedding-001
      - key: JWT_SECRET
        sync: false
      # ── BullMQ background jobs (Part 1) ────────────────────────────
      # Socket Redis URL (Upstash rediss:// or local redis://). Required for the
      # post-conversation worker. Rest client (UPSTASH_REDIS_REST_*) cannot drive
      # BullMQ, so this is a separate connection.
      - key: BULLMQ_REDIS_URL
        sync: false
      # ── AWS SQS escalation feed (Part 2 — optional, isolated) ──────
      - key: AWS_SQS_ESCALATIONS_ENABLED
        value: "false"
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_SQS_ESCALATION_QUEUE_URL
        sync: false
      - key: AWS_SQS_ESCALATION_QUEUE_NAME
        sync: false
