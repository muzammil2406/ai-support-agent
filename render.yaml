# Render Blueprint — AI Support Agent backend (NestJS + LangGraph, free tier)
# Deploy: Render dashboard → New → Blueprint → pick this repo → fill the
# `sync: false` environment variables with the values from backend/.env.
services:
  - type: web
    name: ai-support-agent-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: http://localhost:3000
      - key: MONGODB_URI
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: gemini-embedding-001
      - key: JWT_SECRET
        sync: false